# Publishes the game to GitHub Pages (terrafall.app) on every push to main, so the installed app picks up each
# update. The github-pages environment allows main (Settings -> Environments -> github-pages -> Deployment branches
# and tags); pushes to the development branch no longer deploy, so work reaches the site once it is on main.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deployment at a time: a push while one is running waits its turn instead of cancelling it
# (cancelled deployments left the live site out of date).
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The build number: the commit's short hash and the date, written into index.html's terrafall-build tag (it reads
      # "dev" in the repository), so a report sent with Send feedback says which commit it came from.
      - name: Stamp the build
        run: |
          BUILD="${GITHUB_SHA::7} $(date -u +%Y-%m-%d)"
          sed -i "s|<meta name=\"terrafall-build\" content=\"dev\">|<meta name=\"terrafall-build\" content=\"$BUILD\">|" index.html
          grep -q "content=\"$BUILD\"" index.html && echo "Build $BUILD" || echo "::warning::index.html has no terrafall-build tag to stamp"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub's Pages API sometimes can't find the artifact just uploaded ("Fetching artifact metadata failed"): wait and
      # try again, up to three times, so a passing hiccup doesn't fail the run (and email the owner).
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}" >> "$GITHUB_OUTPUT"

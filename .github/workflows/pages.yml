# Publishes the game to GitHub Pages (terrafall.app) on every push to main, so the installed app picks up each
# update. The github-pages environment allows main (Settings -> Environments -> github-pages -> Deployment branches
# and tags); pushes to the development branch no longer deploy, so work reaches the site once it is on main.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deployment at a time: a push while one is running waits its turn instead of cancelling it
# (cancelled deployments left the live site out of date).
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

# Deploys the multiplayer relay (relay/) to Cloudflare Workers.
# One-time setup (repo Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Account ID shown on the Cloudflare dashboard (Workers & Pages, on the right)
# Then Actions → Deploy multiplayer relay → Run workflow. Without the secrets it does nothing (and doesn't fail).
# Player feedback (relay/src/feedback.js, the game's "Send feedback" form) needs two more secrets, then a run:
#   FEEDBACK_REPO    the private repository reports go to, as owner/name (e.g. tadellsworth/terrafall-feedback)
#   FEEDBACK_TOKEN   a fine-grained GitHub token for that repository only: Issues and Contents, read and write
# Without them the relay still runs and the form says feedback isn't set up yet.
name: Deploy multiplayer relay
on:
  workflow_dispatch:
  push:
    branches: [claude/elegant-cori-a8yj96]
    paths: ['relay/**', '.github/workflows/relay.yml']
permissions:
  contents: read
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::The Cloudflare secrets aren't set up yet, so the relay wasn't deployed (see the top of relay.yml)."; fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      # Cloudflare can take a moment to see a Worker it has just been sent: switching on its workers.dev address straight
      # after the upload sometimes fails with "This Worker does not exist on your account [code: 10007]". So a failed
      # deploy waits half a minute and tries again (twice), and only then does the run fail.
      - if: steps.check.outputs.ok == 'true'
        id: deploy1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: '4.40.0'
      - if: steps.check.outputs.ok == 'true' && steps.deploy1.outcome == 'failure'
        run: sleep 30
      - if: steps.check.outputs.ok == 'true' && steps.deploy1.outcome == 'failure'
        id: deploy2
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: '4.40.0'
      - if: steps.check.outputs.ok == 'true' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - if: steps.check.outputs.ok == 'true' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        id: deploy3
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: '4.40.0'
      # Feedback: hand the token and the repository to the Worker as secrets (only when both are set).
      - if: steps.check.outputs.ok == 'true'
        id: feedback
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          FEEDBACK_REPO: ${{ secrets.FEEDBACK_REPO }}
        run: |
          if [ -n "$FEEDBACK_TOKEN" ] && [ -n "$FEEDBACK_REPO" ]; then
            printf '%s' "$FEEDBACK_TOKEN" | npx --yes wrangler@4.40.0 secret put FEEDBACK_TOKEN
            printf '%s' "$FEEDBACK_REPO" | npx --yes wrangler@4.40.0 secret put FEEDBACK_REPO
            echo "state=on" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Player feedback isn't set up yet: add the FEEDBACK_REPO and FEEDBACK_TOKEN secrets (see the top of relay.yml), then run this again."
            echo "state=off" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ok == 'true'
        env:
          FEEDBACK: ${{ steps.feedback.outputs.state }}
          OUT: ${{ steps.deploy1.outputs.command-output }}${{ steps.deploy2.outputs.command-output }}${{ steps.deploy3.outputs.command-output }}
          URL: ${{ steps.deploy1.outputs.deployment-url || steps.deploy2.outputs.deployment-url || steps.deploy3.outputs.deployment-url }}
        run: |
          U="$URL"; [ -n "$U" ] || U=$(printf '%s' "$OUT" | grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' | head -1)
          echo "Relay address: $U"
          { echo "### Multiplayer relay deployed"; echo; echo "Address: **$U**"; echo; echo "Check it: open $U in a browser; it should say *Terrafall relay: ok*."; echo; echo "Player feedback: **$FEEDBACK**"; } >> "$GITHUB_STEP_SUMMARY"

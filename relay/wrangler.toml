# Terrafall multiplayer relay (see src/index.js). Deployed by .github/workflows/relay.yml.
name = "terrafall-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One Durable Object per game room (the free plan needs the SQLite-backed kind; the relay keeps nothing on disk).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Player feedback (src/feedback.js): one Durable Object that counts reports per sender, to stop floods.
[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Gate"]

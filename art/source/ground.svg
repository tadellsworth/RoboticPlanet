    <feMerge result="col"><feMergeNode in="base"/><feMergeNode in="mott"/><feMergeNode in="pale"/><feMergeNode in="grainD"/><feMergeNode in="grainL"/></feMerge>
    <feComposite in="lit" in2="col" operator="arithmetic" k1="0.3" k2="0" k3="0.7" k4="0"/>
  </filter>

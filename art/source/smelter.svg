<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>  <filter id="shadow" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
    <feOffset dx="6" dy="7" result="b"/>
    <feFlood flood-color="#0d0805" flood-opacity="0.55"/>
    <feComposite in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadowB" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
    <feOffset dx="9" dy="11" result="b"/>
    <feFlood flood-color="#0d0805" flood-opacity="0.55"/>
    <feComposite in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="metal" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="fine"/>
    <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.045  0 0 0 0 0.04  1.2 0 0 0 -0.58" result="speck"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="12" result="coarse"/>
    <feColorMatrix in="coarse" type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.39  0 0 0 0 0.25  2 0 0 0 -0.98" result="dirt"/>
    <feMerge result="tex"><feMergeNode in="dirt"/><feMergeNode in="speck"/></feMerge>
    <feComposite in="tex" in2="SourceAlpha" operator="in" result="texIn"/>
    <feOffset in="SourceAlpha" dx="1.5" dy="1.5" result="o1"/>
    <feComposite in="SourceAlpha" in2="o1" operator="out" result="hiEdge"/>
    <feFlood flood-color="#eef3f6" flood-opacity="0.38"/>
    <feComposite in2="hiEdge" operator="in" result="hi"/>
    <feOffset in="SourceAlpha" dx="-2" dy="-2" result="o2"/>
    <feComposite in="SourceAlpha" in2="o2" operator="out" result="loEdge"/>
    <feFlood flood-color="#000" flood-opacity="0.6"/>
    <feComposite in2="loEdge" operator="in" result="lo"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="texIn"/><feMergeNode in="hi"/><feMergeNode in="lo"/></feMerge>
  </filter>
  <filter id="paint" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.17" numOctaves="3" seed="31" result="chipN"/>
    <feColorMatrix in="chipN" type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.26  0 0 0 0 0.28  9 0 0 0 -6.1" result="chips"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="fine"/>
    <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.06  1 0 0 0 -0.5" result="speck"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="17" result="coarse"/>
    <feColorMatrix in="coarse" type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.39  0 0 0 0 0.25  2.2 0 0 0 -1.05" result="dirt"/>
    <feMerge result="tex"><feMergeNode in="chips"/><feMergeNode in="dirt"/><feMergeNode in="speck"/></feMerge>
    <feComposite in="tex" in2="SourceAlpha" operator="in" result="texIn"/>
    <feOffset in="SourceAlpha" dx="1.5" dy="1.5" result="o1"/>
    <feComposite in="SourceAlpha" in2="o1" operator="out" result="hiEdge"/>
    <feFlood flood-color="#ffffff" flood-opacity="0.45"/>
    <feComposite in2="hiEdge" operator="in" result="hi"/>
    <feOffset in="SourceAlpha" dx="-2" dy="-2" result="o2"/>
    <feComposite in="SourceAlpha" in2="o2" operator="out" result="loEdge"/>
    <feFlood flood-color="#000" flood-opacity="0.55"/>
    <feComposite in2="loEdge" operator="in" result="lo"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="texIn"/><feMergeNode in="hi"/><feMergeNode in="lo"/></feMerge>
  </filter>
  <filter id="stone" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="4" seed="8" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="3.5" diffuseConstant="1.25" lighting-color="#ffffff" result="lit">
      <feDistantLight azimuth="225" elevation="50"/>
    </feDiffuseLighting>
    <feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="mul"/>
    <feComposite in="mul" in2="SourceAlpha" operator="in" result="body"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="fine"/>
    <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.045  0 0 0 0 0.04  1.1 0 0 0 -0.55" result="speck"/>
    <feComposite in="speck" in2="SourceAlpha" operator="in" result="speckIn"/>
    <feOffset in="SourceAlpha" dx="1.5" dy="1.5" result="o1"/>
    <feComposite in="SourceAlpha" in2="o1" operator="out" result="hiEdge"/>
    <feFlood flood-color="#ffffff" flood-opacity="0.35"/>
    <feComposite in2="hiEdge" operator="in" result="hi"/>
    <feOffset in="SourceAlpha" dx="-2" dy="-2" result="o2"/>
    <feComposite in="SourceAlpha" in2="o2" operator="out" result="loEdge"/>
    <feFlood flood-color="#000" flood-opacity="0.5"/>
    <feComposite in2="loEdge" operator="in" result="lo"/>
    <feMerge><feMergeNode in="body"/><feMergeNode in="speckIn"/><feMergeNode in="hi"/><feMergeNode in="lo"/></feMerge>
  </filter>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="blur5" filterUnits="userSpaceOnUse" x="-140" y="-140" width="280" height="280"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="haz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#1b1a17"/><rect width="5" height="10" fill="#b08a2e"/>
  </pattern>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5d646b"/><stop offset="1" stop-color="#2b2f34"/>
  </linearGradient>
  <linearGradient id="steelL" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#737b82"/><stop offset="1" stop-color="#3b4046"/>
  </linearGradient>
  <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7a8288"/><stop offset="1" stop-color="#3c4247"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2c3035"/><stop offset=".6" stop-color="#1f2226"/><stop offset="1" stop-color="#5e4632"/>
  </linearGradient>
  <linearGradient id="dustV" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".45" stop-color="#a27b4f" stop-opacity="0"/><stop offset="1" stop-color="#a27b4f" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="litOver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".3"/>
  </linearGradient>
  <radialGradient id="rust">
    <stop offset="0" stop-color="#a8521d" stop-opacity=".85"/><stop offset=".5" stop-color="#8a4318" stop-opacity=".5"/><stop offset="1" stop-color="#7a3a17" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="scorch">
    <stop offset="0" stop-color="#0d0907" stop-opacity=".8"/><stop offset=".55" stop-color="#1a120c" stop-opacity=".4"/><stop offset="1" stop-color="#1a120c" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="sm-side" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b6168"/><stop offset=".35" stop-color="#40464c"/><stop offset="1" stop-color="#181a1d"/>
  </linearGradient>
  <linearGradient id="sm-stack" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5e646a"/><stop offset=".4" stop-color="#3d4247"/><stop offset="1" stop-color="#16181a"/>
  </linearGradient>
  <linearGradient id="sm-soot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0807" stop-opacity=".9"/><stop offset=".6" stop-color="#0a0807" stop-opacity=".3"/><stop offset="1" stop-color="#0a0807" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="sm-top" cx=".38" cy=".32" r=".75">
    <stop offset="0" stop-color="#6f777e"/><stop offset="1" stop-color="#2f3338"/>
  </radialGradient>
  <radialGradient id="sm-hole">
    <stop offset="0" stop-color="#ffe0a0"/><stop offset=".3" stop-color="#ff8a1e"/><stop offset=".75" stop-color="#7a2606"/><stop offset="1" stop-color="#1a0b05"/>
  </radialGradient>
  <linearGradient id="sm-mouth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff2c8"/><stop offset=".4" stop-color="#ffa53a"/><stop offset="1" stop-color="#e2500e"/>
  </linearGradient>
  <radialGradient id="sm-spill">
    <stop offset="0" stop-color="#ff8a24" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a24" stop-opacity="0"/>
  </radialGradient>
</defs>
<g transform="translate(122,130)">
  <ellipse cx="0" cy="80" rx="44" ry="16" fill="url(#sm-spill)"/>
  <g filter="url(#shadowB)">
    <!-- chimney stack (behind) -->
    <g filter="url(#metal)">
      <path d="M-78,-98 V-40 A14,13 0 0 0 -50,-40 V-98 Z" fill="url(#sm-stack)"/>
      <path d="M-78,-98 V-40 A14,13 0 0 0 -50,-40 V-98 Z" fill="url(#sm-soot)"/>
      <path d="M-78,-80 A14,13 0 0 0 -50,-80 M-78,-60 A14,13 0 0 0 -50,-60" fill="none" stroke="#111214" stroke-width="2.2"/>
      <ellipse cx="-64" cy="-98" rx="14" ry="13" fill="#2a2d31"/>
      <ellipse cx="-64" cy="-98" rx="10" ry="9" fill="#0c0b0a"/>
      <path d="M-38,-30 L-56,-46" stroke="#33383d" stroke-width="11" stroke-linecap="round"/>
    </g>
    <!-- furnace -->
    <g filter="url(#metal)">
      <path d="M-52,-4 A52,48 0 0 0 52,-4 L52,26 A52,48 0 0 1 -52,26 Z" fill="url(#sm-side)"/>
      <path d="M-52,8 A52,48 0 0 0 52,8 M-52,20 A52,48 0 0 0 52,20" fill="none" stroke="#151719" stroke-width="2.4"/>
      <ellipse cx="0" cy="-4" rx="52" ry="48" fill="url(#sm-top)"/>
      <ellipse cx="0" cy="-4" rx="44" ry="40" fill="none" stroke="#1b1d20" stroke-width="2"/>
      <ellipse cx="0" cy="-4" rx="48" ry="44" fill="none" stroke="#9aa2a8" stroke-width="2.6" stroke-dasharray="0.1 11" stroke-linecap="round"/>
      <ellipse cx="-14" cy="18" rx="22" ry="12" fill="url(#scorch)"/>
      <ellipse cx="20" cy="-30" rx="18" ry="10" fill="url(#scorch)"/>
      <ellipse cx="2" cy="-6" rx="24" ry="22" fill="#2a2e33" stroke="#555c62" stroke-width="3"/>
    </g>
    <!-- ingot moulds -->
    <g filter="url(#metal)">
      <rect x="56" y="54" width="44" height="8" fill="url(#wall)"/>
      <rect x="56" y="-4" width="44" height="58" rx="2" fill="url(#steel)"/>
      <g fill="#141517">
        <rect x="61" y="2" width="15" height="11" rx="1.5"/><rect x="80" y="2" width="15" height="11" rx="1.5"/>
        <rect x="61" y="19" width="15" height="11" rx="1.5"/><rect x="80" y="19" width="15" height="11" rx="1.5"/>
        <rect x="61" y="36" width="15" height="11" rx="1.5"/><rect x="80" y="36" width="15" height="11" rx="1.5"/>
      </g>
      <g fill="#8f979d">
        <rect x="63" y="38" width="11" height="7" rx="1"/><rect x="82" y="38" width="11" height="7" rx="1"/><rect x="82" y="21" width="11" height="7" rx="1"/>
      </g>
      <rect x="-90" y="42" width="30" height="7" fill="#596067"/><rect x="-86" y="35" width="30" height="7" fill="#6b737a"/>
      <rect x="-90" y="49" width="30" height="5" fill="url(#wall)"/>
    </g>
  </g>
  <!-- orange-hot glow -->
  <g filter="url(#glow)">
    <ellipse cx="2" cy="-6" rx="16" ry="14.5" fill="url(#sm-hole)"/>
    <path d="M-17,72 V52 A17,15 0 0 1 17,52 V72 Z" fill="url(#sm-mouth)"/>
    <rect x="63" y="4" width="11" height="7" rx="1" fill="#ff8a1e"/>
    <rect x="82" y="4" width="11" height="7" rx="1" fill="#ffa53a"/>
    <rect x="63" y="21" width="11" height="7" rx="1" fill="#ff7414"/>
    <ellipse cx="-64" cy="-98" rx="6" ry="5" fill="#ff6a14" opacity=".5"/>
  </g>
  <path d="M-17,72 V52 A17,15 0 0 1 17,52 V72" fill="none" stroke="#1b1d20" stroke-width="3"/>
</g>
</svg>

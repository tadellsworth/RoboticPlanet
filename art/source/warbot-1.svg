      <rect x="-90" y="-84" width="106" height="24" rx="9" fill="url(#wb-cleat)"/>
      <rect x="-90" y="60" width="106" height="24" rx="9" fill="url(#wb-cleat)"/>
    </g>
    <g filter="url(#metal)">
      <polygon points="100,0 42,-30 8,-70 -70,-72 -94,-52 -94,52 -70,72 8,70 42,30" fill="url(#wb-armor)"/>
      <path d="M42,-30 L0,-20 M42,30 L0,20 M8,-70 L-8,-48 M8,70 L-8,48 M-70,-72 L-60,-50 M-70,72 L-60,50 M-94,-52 L-78,-34 M-94,52 L-78,34" stroke="#0f1113" stroke-width="2.2"/>
    </g>
    <g filter="url(#metal)">
      <polygon points="72,0 28,-22 -2,-48 -58,-50 -78,-34 -78,34 -58,50 -2,48 28,22" fill="url(#wb-top)"/>
      <path d="M-2,-48 L-26,-14 L-26,14 L-2,48 M28,-22 L-26,-14 M28,22 L-26,14" fill="none" stroke="#111315" stroke-width="2"/>
      <rect x="-68" y="-26" width="32" height="52" rx="3" fill="#191b1e"/>
      <rect x="-65" y="-22" width="26" height="4" fill="#08090a"/>
      <rect x="-65" y="-13" width="26" height="4" fill="#08090a"/>

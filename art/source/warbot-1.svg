      <circle cx="-14" cy="-32" r="4.5" fill="#22262a" stroke="#6d757c" stroke-width="1.6"/>
    </g>
    <g filter="url(#glow)">
      <polygon points="60,0 36,-15 30,-11 50,0 30,11 36,15" fill="#ff5a6e"/>
      <path d="M88,-3 L46,-25 M88,3 L46,25 M-6,-63 L-62,-65 M-6,63 L-62,65" stroke="#ff5a6e" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="-97" y="-30" width="4" height="16" rx="1.5" fill="#ff5a6e"/>
      <rect x="-97" y="14" width="4" height="16" rx="1.5" fill="#ff5a6e"/>
    </g>
    <path d="M55,0 L36,-12 M55,0 L36,12" stroke="#ffffff" stroke-width="1.4" opacity=".8"/>
    <g filter="url(#metal)">
      <rect x="-10" y="-49" width="50" height="26" rx="6" fill="#363b41"/>
      <rect x="-10" y="23" width="50" height="26" rx="6" fill="#363b41"/>
      <rect x="-4" y="-44" width="14" height="16" rx="2" fill="#1d2023"/>
      <rect x="-4" y="28" width="14" height="16" rx="2" fill="#1d2023"/>
      <rect x="38" y="-42" width="70" height="12" rx="3" fill="url(#wb-barrel)"/>
      <rect x="38" y="30" width="70" height="12" rx="3" fill="url(#wb-barrel)"/>
      <rect x="102" y="-44" width="16" height="16" rx="2" fill="#2a2e33"/>
      <rect x="102" y="28" width="16" height="16" rx="2" fill="#2a2e33"/>
      <path d="M107,-44 V-28 M112,-44 V-28 M107,28 V44 M112,28 V44" stroke="#08090a" stroke-width="2"/>
    </g>
    <g filter="url(#glowS)">
      <rect x="62" y="-43" width="4" height="14" rx="1" fill="#ff5a6e"/>
      <rect x="74" y="-43" width="4" height="14" rx="1" fill="#ff5a6e"/>
      <rect x="62" y="29" width="4" height="14" rx="1" fill="#ff5a6e"/>
      <rect x="74" y="29" width="4" height="14" rx="1" fill="#ff5a6e"/>

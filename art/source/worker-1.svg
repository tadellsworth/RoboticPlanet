<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
  <filter id="wk-shadow" filterUnits="userSpaceOnUse" x="-130" y="-130" width="260" height="260" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
    <feOffset dx="6" dy="7" result="b"/>
    <feFlood flood-color="#0d0805" flood-opacity="0.55"/>
    <feComposite in2="b" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="wk-metal" filterUnits="userSpaceOnUse" x="-130" y="-130" width="260" height="260" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="fine"/>
    <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.045  0 0 0 0 0.04  1.2 0 0 0 -0.58" result="speck"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="12" result="coarse"/>
    <feColorMatrix in="coarse" type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.39  0 0 0 0 0.25  2 0 0 0 -0.98" result="dirt"/>
    <feMerge result="tex"><feMergeNode in="dirt"/><feMergeNode in="speck"/></feMerge>
    <feComposite in="tex" in2="SourceAlpha" operator="in" result="texIn"/>
    <feOffset in="SourceAlpha" dx="1.5" dy="1.5" result="o1"/>
    <feComposite in="SourceAlpha" in2="o1" operator="out" result="hiEdge"/>
    <feFlood flood-color="#eef3f6" flood-opacity="0.38"/>
    <feComposite in2="hiEdge" operator="in" result="hi"/>
    <feOffset in="SourceAlpha" dx="-2" dy="-2" result="o2"/>
    <feComposite in="SourceAlpha" in2="o2" operator="out" result="loEdge"/>
    <feFlood flood-color="#000" flood-opacity="0.6"/>
    <feComposite in2="loEdge" operator="in" result="lo"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="texIn"/><feMergeNode in="hi"/><feMergeNode in="lo"/></feMerge>
  </filter>
  <filter id="wk-paint" filterUnits="userSpaceOnUse" x="-130" y="-130" width="260" height="260" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.17" numOctaves="3" seed="31" result="chipN"/>
    <feColorMatrix in="chipN" type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.26  0 0 0 0 0.28  9 0 0 0 -6.1" result="chips"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="fine"/>
    <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.06  1 0 0 0 -0.5" result="speck"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="17" result="coarse"/>
    <feColorMatrix in="coarse" type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.39  0 0 0 0 0.25  2.2 0 0 0 -1.05" result="dirt"/>
    <feMerge result="tex"><feMergeNode in="chips"/><feMergeNode in="dirt"/><feMergeNode in="speck"/></feMerge>
    <feComposite in="tex" in2="SourceAlpha" operator="in" result="texIn"/>
    <feOffset in="SourceAlpha" dx="1.5" dy="1.5" result="o1"/>
    <feComposite in="SourceAlpha" in2="o1" operator="out" result="hiEdge"/>
    <feFlood flood-color="#ffffff" flood-opacity="0.45"/>
    <feComposite in2="hiEdge" operator="in" result="hi"/>
    <feOffset in="SourceAlpha" dx="-2" dy="-2" result="o2"/>
    <feComposite in="SourceAlpha" in2="o2" operator="out" result="loEdge"/>
    <feFlood flood-color="#000" flood-opacity="0.55"/>
    <feComposite in2="loEdge" operator="in" result="lo"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="texIn"/><feMergeNode in="hi"/><feMergeNode in="lo"/></feMerge>
  </filter>
  <filter id="wk-glow" filterUnits="userSpaceOnUse" x="-130" y="-130" width="260" height="260">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <pattern id="wk-cleat" x="0" y="-84" width="9" height="168" patternUnits="userSpaceOnUse">
    <rect width="9" height="168" fill="#141517"/>
    <rect x="1.5" y="3" width="5" height="30" rx="1" fill="#3a3d41"/>
    <rect x="1.5" y="135" width="5" height="30" rx="1" fill="#3a3d41"/>
  </pattern>
  <pattern id="wk-haz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#1b1a17"/><rect width="5" height="10" fill="#b08a2e"/>
  </pattern>
  <linearGradient id="wk-steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5d646b"/><stop offset="1" stop-color="#2b2f34"/>
  </linearGradient>
  <linearGradient id="wk-rail" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7a8288"/><stop offset="1" stop-color="#3c4247"/>
  </linearGradient>
  <linearGradient id="wk-cab" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c2bfb4"/><stop offset=".55" stop-color="#9f9c92"/><stop offset="1" stop-color="#6d6b64"/>
  </linearGradient>
  <radialGradient id="wk-head" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#d4d1c7"/><stop offset=".6" stop-color="#a3a096"/><stop offset="1" stop-color="#6b6962"/>
  </radialGradient>
  <radialGradient id="wk-eye" cx=".4" cy=".4" r=".6">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ff5a6e"/><stop offset="1" stop-color="#ff5a6e"/>
  </radialGradient>
</defs>

<g transform="translate(122,124)">
  <g filter="url(#wk-shadow)">
    <!-- treads -->
    <g filter="url(#wk-metal)">
      <rect x="-96" y="-84" width="190" height="36" rx="18" fill="url(#wk-cleat)"/>
      <rect x="-96" y="48" width="190" height="36" rx="18" fill="url(#wk-cleat)"/>
    </g>

    <!-- chassis and cargo cradle -->
    <g filter="url(#wk-metal)">
      <rect x="-88" y="-58" width="178" height="116" rx="32" fill="url(#wk-steel)"/>
      <rect x="-78" y="-42" width="76" height="84" rx="6" fill="#1a1c1f"/>
      <rect x="-70" y="-38" width="9" height="76" fill="#32373c"/>
      <rect x="-50" y="-38" width="9" height="76" fill="#32373c"/>
      <rect x="-30" y="-38" width="9" height="76" fill="#32373c"/>
    </g>
    <g filter="url(#wk-metal)">
      <rect x="-84" y="-51" width="84" height="10" rx="3" fill="url(#wk-rail)"/>
      <rect x="-84" y="41" width="84" height="10" rx="3" fill="url(#wk-rail)"/>
      <rect x="-93" y="-51" width="13" height="102" rx="4" fill="url(#wk-rail)"/>
      <rect x="-91" y="-30" width="9" height="60" fill="url(#wk-haz)"/>
      <rect x="-96" y="-56" width="17" height="17" rx="4" fill="#4a5056"/>
      <rect x="-96" y="39" width="17" height="17" rx="4" fill="#4a5056"/>
      <circle cx="-87.5" cy="-47.5" r="2.4" fill="#9aa2a8"/>
      <circle cx="-87.5" cy="47.5" r="2.4" fill="#9aa2a8"/>
    </g>

    <!-- painted cab -->
    <g filter="url(#wk-paint)">
      <path d="M-4,-50 H50 C78,-50 92,-30 92,0 C92,30 78,50 50,50 H-4 Z" fill="url(#wk-cab)"/>
    </g>
    <g filter="url(#wk-metal)">
      <path d="M-4,-36 C-14,-38 -18,-46 -26,-47 M-4,36 C-14,38 -18,46 -26,47" fill="none" stroke="#101113" stroke-width="3.6" stroke-linecap="round"/>
      <rect x="0" y="-22" width="16" height="44" rx="3" fill="#2a2d31"/>
      <rect x="3" y="-18" width="10" height="4" fill="#0b0c0e"/>
      <rect x="3" y="-9" width="10" height="4" fill="#0b0c0e"/>
      <rect x="3" y="0" width="10" height="4" fill="#0b0c0e"/>
      <rect x="3" y="9" width="10" height="4" fill="#0b0c0e"/>
      <circle cx="9" cy="36" r="6.5" fill="#1b1d20" stroke="#737b82" stroke-width="2.2"/>
      <circle cx="9" cy="-36" r="8" fill="#2a2d31" stroke="#737b82" stroke-width="2"/>
    </g>
    <g filter="url(#wk-paint)">
      <circle cx="50" cy="0" r="31" fill="url(#wk-head)"/>
    </g>
    <g filter="url(#wk-metal)">
      <rect x="88" y="-38" width="12" height="76" rx="5" fill="url(#wk-haz)"/>
      <circle cx="70" cy="0" r="18" fill="#101215"/>
      <circle cx="70" cy="0" r="18" fill="none" stroke="#5e666d" stroke-width="2.2"/>
    </g>

    <!-- team-colour lights -->
    <g filter="url(#wk-glow)">
      <circle cx="71" cy="0" r="13.5" fill="url(#wk-eye)"/>
      <circle cx="9" cy="-36" r="5" fill="#ff5a6e"/>
      <rect x="-98" y="-50" width="5" height="12" rx="2" fill="#ff5a6e"/>
      <rect x="-98" y="38" width="5" height="12" rx="2" fill="#ff5a6e"/>
    </g>
    <ellipse cx="66.5" cy="-4.5" rx="4.6" ry="2.8" transform="rotate(-35 66.5 -4.5)" fill="#ffffff" opacity=".75"/>
    <circle cx="7.5" cy="-37.5" r="1.6" fill="#ffffff" opacity=".85"/>
  </g>
</g>
</svg>

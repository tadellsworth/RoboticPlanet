    <polygon points="10,-100 20,-100 0,-132" fill="#6a45c4"/>
    <rect x="-5" y="-96" width="7" height="90" fill="url(#cr-core)"/>
    <path d="M-10,4 V-100 L0,-132 M10,4 V-100 M-20,-100 H20" fill="none" stroke="#f1eaff" stroke-width="1.2" opacity=".55"/>
    <path d="M-20,0 V-100 L0,-132 L20,-100 V0" fill="none" stroke="#2a1660" stroke-width="1.6" opacity=".7"/>
  </g>
      <g transform="translate(36,38) rotate(34) scale(.85 .72)">
    <polygon points="-20,0 -10,4 -10,-100 -20,-100" fill="#c7b1ff"/>
    <polygon points="-10,4 10,4 10,-100 -10,-100" fill="#8a5cf0"/>
    <polygon points="10,4 20,0 20,-100 10,-100" fill="#4a2a99"/>
    <polygon points="-20,-100 -10,-100 0,-132" fill="#ece2ff"/>
    <polygon points="-10,-100 10,-100 0,-132" fill="#b18bff"/>
    <polygon points="10,-100 20,-100 0,-132" fill="#6a45c4"/>
    <rect x="-5" y="-96" width="7" height="90" fill="url(#cr-core)"/>
    <path d="M-10,4 V-100 L0,-132 M10,4 V-100 M-20,-100 H20" fill="none" stroke="#f1eaff" stroke-width="1.2" opacity=".55"/>
    <path d="M-20,0 V-100 L0,-132 L20,-100 V0" fill="none" stroke="#2a1660" stroke-width="1.6" opacity=".7"/>
  </g>
      <g transform="translate(4,42) rotate(4) scale(1.15 .95)">
    <polygon points="-20,0 -10,4 -10,-100 -20,-100" fill="#c7b1ff"/>
    <polygon points="-10,4 10,4 10,-100 -10,-100" fill="#8a5cf0"/>
    <polygon points="10,4 20,0 20,-100 10,-100" fill="#4a2a99"/>
    <polygon points="-20,-100 -10,-100 0,-132" fill="#ece2ff"/>
    <polygon points="-10,-100 10,-100 0,-132" fill="#b18bff"/>
    <polygon points="10,-100 20,-100 0,-132" fill="#6a45c4"/>
    <rect x="-5" y="-96" width="7" height="90" fill="url(#cr-core)"/>
    <path d="M-10,4 V-100 L0,-132 M10,4 V-100 M-20,-100 H20" fill="none" stroke="#f1eaff" stroke-width="1.2" opacity=".55"/>
    <path d="M-20,0 V-100 L0,-132 L20,-100 V0" fill="none" stroke="#2a1660" stroke-width="1.6" opacity=".7"/>
  </g>
      <g transform="translate(-52,46) rotate(-62) scale(.45 .38)">
    <polygon points="-20,0 -10,4 -10,-100 -20,-100" fill="#c7b1ff"/>
    <polygon points="-10,4 10,4 10,-100 -10,-100" fill="#8a5cf0"/>
    <polygon points="10,4 20,0 20,-100 10,-100" fill="#4a2a99"/>
    <polygon points="-20,-100 -10,-100 0,-132" fill="#ece2ff"/>
    <polygon points="-10,-100 10,-100 0,-132" fill="#b18bff"/>
    <polygon points="10,-100 20,-100 0,-132" fill="#6a45c4"/>
    <rect x="-5" y="-96" width="7" height="90" fill="url(#cr-core)"/>
    <path d="M-10,4 V-100 L0,-132 M10,4 V-100 M-20,-100 H20" fill="none" stroke="#f1eaff" stroke-width="1.2" opacity=".55"/>
    <path d="M-20,0 V-100 L0,-132 L20,-100 V0" fill="none" stroke="#2a1660" stroke-width="1.6" opacity=".7"/>
  </g>
      <g transform="translate(58,50) rotate(70) scale(.4 .32)">
    <polygon points="-20,0 -10,4 -10,-100 -20,-100" fill="#c7b1ff"/>
    <polygon points="-10,4 10,4 10,-100 -10,-100" fill="#8a5cf0"/>
    <polygon points="10,4 20,0 20,-100 10,-100" fill="#4a2a99"/>
    <polygon points="-20,-100 -10,-100 0,-132" fill="#ece2ff"/>
    <polygon points="-10,-100 10,-100 0,-132" fill="#b18bff"/>
    <polygon points="10,-100 20,-100 0,-132" fill="#6a45c4"/>
    <rect x="-5" y="-96" width="7" height="90" fill="url(#cr-core)"/>
    <path d="M-10,4 V-100 L0,-132 M10,4 V-100 M-20,-100 H20" fill="none" stroke="#f1eaff" stroke-width="1.2" opacity=".55"/>
    <path d="M-20,0 V-100 L0,-132 L20,-100 V0" fill="none" stroke="#2a1660" stroke-width="1.6" opacity=".7"/>
  </g>
    </g>
  </g>
  <g fill="#e7dcff" filter="url(#glowS)">
    <circle cx="-70" cy="-40" r="1.6"/><circle cx="78" cy="-58" r="1.4"/><circle cx="20" cy="-108" r="1.5"/>
